[workspace]
members = ["oracle"]

[package]
name = "rcheevr"
version = "0.0.0"
edition = "2021"
authors = ["wesley <wesley@bitechular.com>"]
description = "Pure-Rust RetroAchievements client: memaddr parser, condition evaluator, rich presence, leaderboards, web API."
license = "MIT"
publish = false

[features]
default = []
http-reqwest = ["dep:reqwest"]
http-fetch = ["dep:wasm-bindgen", "dep:wasm-bindgen-futures", "dep:js-sys", "dep:web-sys"]
# Differential tests against rcheevos. Requires a C toolchain. Never shipped.
oracle = ["dep:rcheevr-oracle"]

[dependencies]
md-5 = "0.10"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
rcheevr-oracle = { path = "oracle", optional = true }
reqwest = { version = "0.12", default-features = false, features = ["rustls-tls"], optional = true }
wasm-bindgen = { version = "0.2", optional = true }
wasm-bindgen-futures = { version = "0.4", optional = true }
js-sys = { version = "0.3", optional = true }
web-sys = { version = "0.3", optional = true, features = ["Headers", "Request", "RequestInit", "Response", "Window"] }

[dev-dependencies]
axum = "0.7"
tokio = { version = "1", features = ["rt-multi-thread", "macros"] }
gameboy-emulator = { path = "../gameboy-emulator/cores/gb" }
