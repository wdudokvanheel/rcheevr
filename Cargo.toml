[package]
name = "rveevr"
version = "0.0.0"
edition = "2021"
authors = ["wesley <wesley@bitechular.com>"]
description = "Pure-Rust RetroAchievements client: memaddr parser, condition evaluator, rich presence, leaderboards, web API."
license = "MIT"
publish = false

[features]
default = []
http-reqwest = []
http-fetch = []

[dependencies]
md-5 = "0.10"
serde = { version = "1", features = ["derive"] }
serde_json = "1"

[dev-dependencies]
