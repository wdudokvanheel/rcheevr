[workspace]
members = ["oracle"]

[package]
name = "rveevr"
version = "0.0.0"
edition = "2021"
authors = ["wesley <wesley@bitechular.com>"]
description = "Pure-Rust RetroAchievements client: memaddr parser, condition evaluator, rich presence, leaderboards, web API."
license = "MIT"
publish = false

[features]
default = []
http-reqwest = ["dep:reqwest"]
http-fetch = []
# Differential tests against rcheevos. Requires a C toolchain. Never shipped.
oracle = ["dep:rveevr-oracle"]

[dependencies]
md-5 = "0.10"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
rveevr-oracle = { path = "oracle", optional = true }
reqwest = { version = "0.12", default-features = false, features = ["blocking", "rustls-tls"], optional = true }

[dev-dependencies]
axum = "0.7"
tokio = { version = "1", features = ["rt-multi-thread", "macros"] }
